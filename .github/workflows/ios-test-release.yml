name: iOS Simulator TEST Release

on:
  push:
    branches: [main]
    paths:
      - "LumaSift/**"
      - "LumaSiftTests/**"
      - "project.yml"
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify master engineering standard
        run: python3 scripts/verify_governance.py
      - name: Generate project
        run: xcodegen generate
      - name: Build and test simulator app
        run: xcodebuild -project LumaSift.xcodeproj -scheme LumaSift -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' clean test CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned app
        run: xcodebuild -project LumaSift.xcodeproj -scheme LumaSift -sdk iphoneos -configuration Release archive -archivePath "$PWD/LumaSift-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Stage simulator TEST package and checksum
        run: |
          mkdir -p release
          ditto LumaSift-unsigned.xcarchive release/LumaSift-unsigned.xcarchive
          ditto LumaSift-unsigned.xcarchive/Products/Applications/LumaSift.app release/LumaSift-Simulator-TEST.app
          cd release && zip -qry LumaSift-iOS-Simulator-TEST.zip LumaSift-Simulator-TEST.app && shasum -a 256 LumaSift-iOS-Simulator-TEST.zip LumaSift-unsigned.xcarchive/Info.plist > LumaSift-iOS-TEST-SHA256SUMS.txt
      - name: Publish iOS TEST prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ios-v0.1.0-test
          name: LumaSift iOS v0.1.0 TEST
          prerelease: true
          generate_release_notes: true
          files: |
            release/LumaSift-iOS-Simulator-TEST.zip
            release/LumaSift-iOS-TEST-SHA256SUMS.txt
