name: LumaSift
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    PRODUCT_BUNDLE_IDENTIFIER: com.lumasift.ios
    DEVELOPMENT_TEAM: ""
targets:
  LumaSift:
    type: application
    platform: iOS
    sources: [LumaSift]
    settings:
      base:
        INFOPLIST_FILE: LumaSift/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lumasift.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [LumaSiftTests]
  LumaSiftTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumaSiftTests]
    dependencies: [target: LumaSift]
